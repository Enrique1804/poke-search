  <path d="M 10 64 A 54 54 0 0 1 118 64 Z" fill="url(#topRed)" />
  <!-- Bottom white half -->
  <path d="M 10 64 A 54 54 0 0 0 118 64 Z" fill="url(#bottomWhite)" />
  <!-- Gloss highlight -->
  <ellipse cx="44" cy="34" rx="18" ry="8" transform="rotate(-25 44 34)" fill="#ffffff" opacity="0.28" />
  <!-- Center divider band -->
  <rect x="8" y="57" width="112" height="14" fill="#0f172a" />
  <!-- Outer border -->
  <circle cx="64" cy="64" r="55" fill="none" stroke="#0f172a" stroke-width="6" />
  <!-- Center button -->
  <circle cx="64" cy="64" r="19" fill="#0f172a" />
  <circle cx="64" cy="64" r="13" fill="#f8fafc" />
  <circle cx="64" cy="64" r="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
</svg>
